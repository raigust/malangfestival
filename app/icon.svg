<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Neobrutalist Drop Shadow -->
  <rect x="44" y="44" width="440" height="440" rx="96" fill="#1E1C1A" />
  
  <!-- Main Card Body (Vibrant Malang Fest Yellow) -->
  <rect x="24" y="24" width="440" height="440" rx="96" fill="#FFE600" stroke="#1E1C1A" stroke-width="28" stroke-linejoin="round" />
  
  <!-- Inner Circle (Electric Punk Pink) -->
  <circle cx="244" cy="244" r="160" fill="#FB4E7B" stroke="#1E1C1A" stroke-width="24" />
  
  <!-- Shadow text for extra punch -->
  <text x="252" y="302" font-family="system-ui, -apple-system, 'Syne', 'Arial Black', sans-serif" font-weight="900" font-size="165" letter-spacing="-6" text-anchor="middle" fill="#1E1C1A">MF</text>
  
  <!-- "MF" Brand Initials in Crisp White -->
  <text x="244" y="294" font-family="system-ui, -apple-system, 'Syne', 'Arial Black', sans-serif" font-weight="900" font-size="165" letter-spacing="-6" text-anchor="middle" fill="#FFFFFF">MF</text>
  
  <!-- Acid Green Sparkle / Star (Top Right) -->
  <path d="M 405 60 L 418 102 L 460 115 L 418 128 L 405 170 L 392 128 L 350 115 L 392 102 Z" fill="#D8FF57" stroke="#1E1C1A" stroke-width="16" stroke-linejoin="round" />
  
  <!-- Red Thumbtack / Paku Payung Pin (Top Left) -->
  <circle cx="95" cy="95" r="28" fill="#EF4444" stroke="#1E1C1A" stroke-width="16" />
  <circle cx="88" cy="88" r="8" fill="#FFFFFF" />
</svg>
